# Run the whole stack with a single command:
#
#   AUTH_SECRET=$(npx auth secret) docker compose up --build
#
# AUTH_SECRET is required (no committed default). This starts Postgres, applies
# Drizzle migrations, then boots the Next.js app on http://localhost:3000.
# To create a login user afterwards, run:
#
#   docker compose run --rm migrate pnpm db:seed you@company.com "your-password" "Your Name"
#
# For development with hot reload, use the `dev` service instead of `app`:
#
#   AUTH_SECRET=$(npx auth secret) pnpm docker:dev
#
# (equivalent to: docker compose watch db migrate dev)
#
# `watch` keeps the dev server running and:
#   - syncs source file changes into the container (HMR, no rebuild)
#   - rebuilds the image when package.json / pnpm-lock.yaml change

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Local-dev default only — never a real secret, and the DB is not exposed
      # beyond the host. Override POSTGRES_PASSWORD with a strong value in prod.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: mm_web
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mm_web"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/mm_web
      SKIP_ENV_VALIDATION: "1"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/mm_web
      # No committed fallback: AUTH_SECRET signs/encrypts session JWTs, so a
      # hardcoded default would be a public signing key. Compose errors out if
      # it isn't provided. Generate one with `npx auth secret`.
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET must be set - generate one with npx auth secret}"
      AUTH_TRUST_HOST: "true"
      # Public URL the browser uses — without this, NextAuth v5 derives the
      # origin from the container bind host (0.0.0.0) and redirects there.
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Development service with hot reload. Run with `docker compose watch dev`
  # (plus db + migrate). Source is bind-mounted so edits hot-reload; the
  # `watch` block rebuilds the image when dependencies change.
  dev:
    build:
      context: .
      target: dev
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/mm_web
      AUTH_SECRET: "${AUTH_SECRET:?AUTH_SECRET must be set - generate one with npx auth secret}"
      AUTH_TRUST_HOST: "true"
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Compose Watch (requires Docker Compose v2.22+). Run with
    # `docker compose watch dev` (or `docker compose up --watch dev`):
    #   - source edits: synced into the container (HMR picks them up)
    #   - dependency / Dockerfile changes: rebuild the image, then restart
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
            - .git/
            - .env
            - .env*.local
            - .coda/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml
        - action: rebuild
          path: Dockerfile

volumes:
  db-data:
